name: Update README cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-cards.yml"
      - ".github/scripts/render-cards.mjs"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out github-readme-stats
        uses: actions/checkout@v7
        with:
          repository: fadielse/github-readme-stats
          ref: master
          path: .grs

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install renderer dependencies
        working-directory: .grs
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Render cards
        env:
          GRS_DIR: .grs
          PAT_1: ${{ secrets.PAT_1 }}
        run: node .github/scripts/render-cards.mjs

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          if git diff --cached --quiet; then
            echo "No card changes."
            exit 0
          fi
          git commit -m "chore: refresh README cards"
          git push
